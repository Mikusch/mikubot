name: Deploy

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      PANEL_URL: ${{ secrets.PTERODACTYL_URL }}
      API_KEY: ${{ secrets.PTERODACTYL_API_KEY }}
      SERVER_ID: ${{ vars.PTERODACTYL_SERVER_ID }}
      JAR_NAME: ${{ vars.JAR_NAME || 'mikubot.jar' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Verify Pterodactyl access
        run: bash scripts/pterodactyl.sh check

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew bootJar

      - name: Deploy
        run: bash scripts/pterodactyl.sh deploy

      - name: Restart server after a failed deploy
        if: failure()
        run: bash scripts/pterodactyl.sh start || true
